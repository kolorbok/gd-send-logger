name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Embed bot API URL
        shell: bash
        env:
          SEND_API_URL: ${{ vars.SEND_API_URL }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          url = os.environ.get("SEND_API_URL", "").strip()
          if not url:
              raise SystemExit("Repository variable SEND_API_URL is missing. Set it to https://your-host/api/v1/gd-send")
          if not url.startswith("https://"):
              raise SystemExit("SEND_API_URL must use https:// for distributable builds")

          Path("src/api_url.hpp").write_text(
              '#pragma once\n\ninline constexpr char SEND_API_URL[] = "' + url.replace('\\', '\\\\').replace('"', '\\"') + '";\n',
              encoding="utf-8",
          )
          print(f"Embedded API host: {url.split('/')[2]}")
          PY

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package universal .geode
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: GD-Send-Logger-Universal
          path: ${{ steps.build.outputs.build-output }}
